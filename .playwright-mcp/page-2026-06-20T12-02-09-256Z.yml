      - heading "왜 하필 지금 비용이 폭발했나" [level=2] [ref=e83]
      - paragraph [ref=e84]: 엔지니어링 관리 플랫폼 Jellyfish의 리서치 총괄 니콜라스 아콜라노는, 에이전틱 기능 확산으로 개발자 1인당 토큰 소비가 9개월 만에 약 18.6배 늘었다고 밝혔습니다. 같은 회사 조사에서는 토큰을 가장 많이 쓰는 개발자가 적게 쓰는 개발자보다 생산성은 약 2배 높았지만, 그 생산성을 얻기 위해 토큰은 10배를 썼다는 결과도 나왔어요. 즉 더 쓴 만큼 더 잘하긴 하는데, 그 효율 비율 자체는 오히려 나빠지고 있다는 뜻입니다. 3월 Faros AI의 2만 명 개발자 대상 설문에서도 산출물은 늘었지만 버그와 재작업도 함께 늘어난 것으로 나타났습니다.
      - generic [ref=e85]:
        - generic [ref=e86]: 💡 포인트
        - text: 토큰 단가는 떨어졌는데 총 비용은 늘었다는 게 핵심입니다. 가격이 아니라 '소비량'이 문제라는 뜻이고, 이건 사용량 통제 없이는 해결되지 않는 구조적인 문제입니다.
      - heading "토큰 비용 관리, 새로운 시장이 열리다" [level=2] [ref=e87]
      - paragraph [ref=e88]: 이 혼란을 비즈니스 기회로 본 곳들도 빠르게 움직이고 있어요. Pay-i처럼 AI 비용 추적·최적화만 전문으로 하는 스타트업부터, Jellyfish·Waydev·Faros AI처럼 AI 에이전트 모니터링으로 ROI를 증명해주는 업체, 그리고 기존 고객 기반을 활용해 기능을 얹는 Ramp·Datadog·New Relic 같은 회사들까지 다양합니다. NEA의 파트너 티퍼니 럭은, AI 코딩 스타트업 Factory가 작업별로 자동으로 가장 적합한 모델을 골라주는 '모델 라우터'를 최근 출시한 사례를 토큰 효율화 흐름의 대표 예시로 꼽았습니다.
