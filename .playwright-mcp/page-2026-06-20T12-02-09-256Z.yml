        - heading "AI 토큰 청구서 폭탄 — 기업들이 갑자기 'AI 비용 통제'를 외치는 이유" [level=1] [ref=e33]
        - paragraph [ref=e34]: 불과 반년 전만 해도 "더 좋은 모델 빨리 써라"였던 분위기가, 지금은 "도대체 우리가 토큰을 얼마나 쓰는 거야?"로 바뀌었습니다. 우버, 마이크로소프트, 프라이스라인까지 줄줄이 AI 비용 경고등이 켜진 2026년 6월의 이야기를 정리해봤습니다.
        - generic [ref=e36]:
          - generic [ref=e37]: ✦ 2026년 6월 기준
          - generic [ref=e38]: · 읽는 시간 약 6분
      - paragraph [ref=e39]: 저는 2002년부터 2013년까지 IT 서비스 기획·운영 쪽에서 일했어요. 그때도 비슷한 패턴을 본 적이 있거든요. 새로운 인프라가 나오면 처음엔 다들 "일단 써보자, 빨리 적용하자"로 달려들다가, 몇 달 뒤 청구서를 받아보고 나서야 "이거 누가 승인한 거야?"라는 회의가 열리는 흐름이요. 클라우드 도입 초기에 딱 그랬는데, 2026년 지금 AI 토큰을 두고 똑같은 장면이 반복되고 있더라고요.
      - paragraph [ref=e40]: TechCrunch가 6월 5일 보도한 기사에 따르면, 우버는 2026년치 AI 코딩 예산을 4월 만에 다 써버렸고, 마이크로소프트는 일부 개발자들에게 부여했던 Claude Code 라이선스를 몇 달 만에 회수했습니다. 프라이스라인 직원은 평범한 커서(Cursor) 계약 갱신 견적이 기존보다 4~5배 비싸게 돌아왔다고 토로했고요. 토큰당 가격은 오히려 떨어졌는데도, 에이전트형 AI 도입이 늘면서 전체 소비량이 그보다 훨씬 빠르게 불어난 게 원인입니다.
      - paragraph [ref=e41]: 이 글에서는 왜 이런 일이 동시다발로 터졌는지, 그리고 이 혼란을 기회로 보고 뛰어든 새로운 시장은 어떤 모습인지 제 나름의 시선으로 정리해보겠습니다.
