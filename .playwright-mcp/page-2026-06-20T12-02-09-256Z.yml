      - heading "'토큰맥싱'에서 '비용 통제'로, 분위기가 바뀐 이유" [level=2] [ref=e57]
      - paragraph [ref=e58]:
        - text: OpenAI의 기업 영업 총괄 알렉산더 엠비리코스는 최근 뉴욕 행사에서, 불과 6개월 전 고객 미팅 주제가 "이 모델이 뭘 할 수 있나, 충분히 좋은가"였다면 지금은 "비용을 얼마나 쓰고 있는지 가시성이 있나, 감사 추적은 가능한가, 토큰 통제 수단은 있나"로 완전히 바뀌었다고 말했습니다.
        - strong [ref=e59]: FinOps 재단
        - text: 의 실행이사 J.R. 스토먼트도 비슷한 증언을 했어요. 4~5월쯤부터 기업들로부터 "2026년 전체 토큰 예산을 4월에 이미 3배 초과했다"는 식의 위기감 섞인 연락이 빗발쳤다고 합니다.
      - generic [ref=e60]:
        - generic [ref=e61]: ⚠ 배경
        - text: 지난해 11월, 앤트로픽의 Claude Opus 4.5, OpenAI의 GPT-5.1, 구글의 Gemini 3 Pro가 잇따라 출시되며 에이전틱 기능이 크게 강화됐습니다. 이게 토큰 소비를 폭발적으로 늘린 직접적인 계기로 꼽힙니다.
      - heading "실제로 무슨 일이 벌어졌나 — 기업 사례" [level=2] [ref=e62]
      - paragraph [ref=e63]: 기사에 나온 구체적인 사례들을 보면 체감이 확 옵니다. 프라이스라인의 IT 재무 담당 임원 크리스 리드는 AI 도입을 "처음엔 맛만 보여주고 결국 거기에 의존하게 만든다"는 식으로 비유하며, 일부 팀에 토큰 사용 한도를 걸기 시작했다고 밝혔어요. 엔지니어링 운영 플랫폼 Faros AI의 CEO 비탈리 고든은, 한 CTO가 "직원 한 명이 지난달 토큰값으로 4만 달러를 썼는데, 막아야 할지 오히려 다른 직원들도 본받게 해야 할지 모르겠다"고 토로한 일화를 전했습니다.
