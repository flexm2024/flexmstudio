<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="잔업정산">
<title>잔업 정산기</title>
<link rel="manifest" id="manifest-placeholder">
<link rel="apple-touch-icon" id="apple-icon">
<meta name="apple-mobile-web-app-title" content="잔업정산기">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');

:root {
  --bg:       #f4f6fb;
  --surface:  #ffffff;
  --card:     #f9fafc;
  --border:   #e4e8f0;
  --accent:   #3b6bfa;
  --green:    #16a34a;
  --gold:     #d97706;
  --red:      #dc2626;
  --sat:      #2563eb;
  --sun:      #dc2626;
  --text:     #1e2640;
  --sub:      #5a6680;
  --muted:    #9aa3b8;
  --radius:   14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  align-items: center;
  justify-content: center;
}

.app-wrap {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--bg);
}

@media (min-width: 640px) {
  body { background: #1a2535; }
  .app-wrap {
    max-width: 430px;
    height: min(900px, 100dvh);
    box-shadow: 0 0 40px rgba(0,0,0,.4);
  }
}

/* ═══ 헤더 ═══ */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
  padding: 0 16px;
  padding-top: env(safe-area-inset-top);
  flex-shrink: 0;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  gap: 12px;
}
.app-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
  white-space: nowrap;
}
.app-title span { color: var(--accent); }

.year-ctrl {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px 8px;
  margin-left: auto;
}
.yc-btn {
  background: none; border: none; color: var(--sub);
  width: 24px; height: 24px; border-radius: 6px;
  font-size: 11px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background .15s;
}
.yc-btn:active { background: var(--border); }
.yc-year { font-size: 13px; font-weight: 700; color: var(--text); min-width: 36px; text-align: center; }

/* ═══ 하단 네비게이션 ═══ */
.bottom-nav {
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 12px rgba(0,0,0,.07);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  flex-shrink: 0;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; padding: 10px 4px;
  border: none; background: none; color: var(--muted);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 10px; cursor: pointer;
  transition: color .2s;
  position: relative;
}
.nav-btn .nav-icon { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active.green-nav { color: var(--green); }
.nav-btn.active.gold-nav { color: var(--gold); }
.nav-btn::after {
  content: '';
  position: absolute; top: 0; left: 20%; right: 20%;
  height: 2px; border-radius: 0 0 2px 2px;
  background: transparent; transition: background .2s;
}
.nav-btn.active::after { background: var(--accent); }
.nav-btn.active.green-nav::after { background: var(--green); }
.nav-btn.active.gold-nav::after { background: var(--gold); }

/* ═══ 월 탭바 ═══ */
.month-tabs {
  background: var(--surface);
  display: flex;
  overflow-x: auto;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.month-tabs::-webkit-scrollbar { display: none; }
.month-tab {
  flex-shrink: 0; padding: 10px 16px;
  border: none; background: none;
  color: var(--muted); font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all .2s;
}
.month-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: 700; }

/* ═══ 스크롤 영역 ═══ */
.content {
  flex: 1; overflow-y: auto;
  padding: 16px;
  padding-bottom: 20px;
}
.view { display: none; }
.view.active { display: block; }

/* ═══ 요약 카드 ═══ */
.summary-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.summary-label {
  font-size: 16px; color: var(--text); font-weight: 700;
  margin-bottom: 14px; letter-spacing: -0.5px;
}
.salary-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.salary-row label { font-size: 12px; color: var(--sub); white-space: nowrap; }
.salary-input-wrap { flex: 1; position: relative; }
.salary-display {
  width: 100%; background: transparent;
  border: none; outline: none;
  border-radius: 0; padding: 0;
  font-size: 14px; font-weight: 700; color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  text-align: right; cursor: pointer;
  transition: none;
}
.salary-display:focus { outline: none; }
.salary-real { display: none; }
.salary-row span { font-size: 13px; color: var(--sub); }

/* 기본급 + 총수령액 한 줄 */
.top-summary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
/* 기본급 박스 */
.salary-group {
  display: flex; flex-direction: column; gap: 0px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 6px 10px; min-width: 0;
}
.salary-group label { font-size: 10px; color: var(--sub); white-space: nowrap; }
.salary-month-tag {
  display: inline-block;
  background: rgba(59,107,250,.1);
  color: var(--accent);
  font-size: 9px; font-weight: 700;
  border-radius: 4px; padding: 1px 5px;
  margin-left: 2px; vertical-align: middle;
}
.salary-edit-btn {
  background: none; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 4px 10px;
  font-size: 11px; font-weight: 600; color: var(--sub);
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all .15s;
}
.salary-edit-btn.editing {
  border-color: var(--accent); color: var(--accent);
  background: rgba(59,107,250,.06);
}
.salary-edit-btn:active { opacity: .7; }
/* 잠금 상태: input 비활성 */
.salary-display.locked {
  pointer-events: none;
  color: var(--text);
  background: transparent;
}
.salary-group .salary-input-wrap { flex: 1; min-width: 0; }
.salary-group .salary-unit-row { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.salary-group span { font-size: 11px; color: var(--sub); white-space: nowrap; flex-shrink: 0; }
/* 총수령액 박스 - 기본급과 동일 크기 */
.final-group {
  display: flex; flex-direction: column; gap: 0px;
  background: #fff5f5; border: 1.5px solid rgba(220,38,38,.25);
  border-radius: 10px; padding: 6px 10px; min-width: 0;
  justify-content: space-between;
}
.final-group .fg-label {
  font-size: 10px; color: var(--sub); white-space: nowrap;
  height: 20px; display: flex; align-items: center;
}
.final-group .fg-bottom { display: flex; align-items: center; gap: 4px; }
.final-group .fg-value {
  font-size: 15px; font-weight: 700; color: var(--red);
  line-height: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; flex: 1;
  text-align: right;
}
.final-group .fg-unit { font-size: 11px; color: var(--sub); white-space: nowrap; flex-shrink: 0; }
.divider-v { display: none; }

/* 잔업 한 줄 */
.ot-inline-row {
  display: flex; align-items: center; gap: 8px;
}
.ot-item {
  flex: 1; display: flex; align-items: center; justify-content: space-between;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.ot-item .oi-label { font-size: 11px; color: var(--sub); }
.ot-item .oi-val-wrap { display: flex; align-items: baseline; gap: 3px; }
.ot-item .oi-val { font-size: 16px; font-weight: 700; color: var(--text); }
.ot-item .oi-val.accent { color: var(--accent); }
.ot-item .oi-unit { font-size: 11px; color: var(--muted); }

/* 기존 stats-grid 제거 */
.stats-grid { display: none; }
.stat-box { display: none; }

/* ═══ 달력 ═══ */
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.cal-title { font-size: 15px; font-weight: 700; color: var(--text); }
.cal-mode-btn {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--sub); border-radius: 8px; padding: 5px 12px;
  font-size: 12px; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all .2s;
}
.cal-mode-btn.editing {
  background: rgba(79,128,255,.15);
  border-color: var(--accent); color: var(--accent);
}
.weekday-row {
  display: grid; grid-template-columns: repeat(7,1fr);
  gap: 3px; margin-bottom: 3px;
}
.wd-label {
  text-align: center; font-size: 10px; font-weight: 700;
  padding: 4px 0; color: var(--muted);
}
.wd-label.sun { color: var(--sun); }
.wd-label.sat { color: var(--sat); }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }

/* 날짜 카드 — 보기 모드 */
.day-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 3px;
  text-align: center; min-height: 58px;
  display: flex; flex-direction: column;
  align-items: center; transition: all .2s;
}
.day-card.empty { background: transparent; border-color: transparent; box-shadow: none; }
.day-card.sat { border-color: rgba(37,99,235,.18); background: rgba(37,99,235,.04); }
.day-card.sun { border-color: rgba(220,38,38,.18); background: rgba(220,38,38,.04); }
.day-card.today { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 0 2px rgba(59,107,250,.12); }
.day-card.has-ot { border-color: var(--border); background: #fff; }
.day-card.sat.has-ot { border-color: rgba(37,99,235,.18); background: rgba(37,99,235,.04); }
.day-card.sun.has-ot { border-color: rgba(220,38,38,.18); background: rgba(220,38,38,.04); }

.day-num {
  font-size: 11px; font-weight: 600; color: var(--sub);
  line-height: 1; margin-bottom: 4px; margin-top: 2px;
}
.day-card.today .day-num {
  color: var(--accent) !important;
  font-size: 12px; font-weight: 800;
  position: relative;
  margin: 2px auto 4px;
}
/* 오늘 날짜 아래 점 표시 */
.day-card.today .day-num::after {
  content: '';
  display: block;
  width: 4px; height: 4px;
  background: var(--accent);
  border-radius: 50%;
  margin: 2px auto 0;
}
.day-card.sat .day-num { color: var(--sat); }
.day-card.sun .day-num { color: var(--sun); }
.day-card.today.sat .day-num { color: var(--sat) !important; }
.day-card.today.sun .day-num { color: var(--sun) !important; }
.day-card.today.sat .day-num::after,
.day-card.today.sun .day-num::after { background: var(--accent); }

/* ot-display, ot-unit 숨김 - input이 직접 표시 */
.ot-display { display: none; }
.ot-unit { display: none; }

/* 잔업 입력 - 항상 보임 */
.ot-input {
  width: 100%; background: transparent;
  border: none;
  border-radius: 5px; padding: 2px 1px;
  font-size: 13px; font-weight: 700;
  text-align: center; color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  -moz-appearance: textfield;
  display: block;
}
.ot-input::-webkit-inner-spin-button,
.ot-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.ot-input:focus {
  outline: none;
  background: #fff;
  border: 1.5px solid var(--accent);
  border-radius: 5px;
}
/* 값 있을 때 파란 배경으로 */
.day-card.has-ot .ot-input {
  color: #fff; background: var(--accent);
  border-radius: 20px; padding: 3px 7px;
  cursor: default;
}
.day-card.has-ot .ot-input:focus {
  color: #fff; background: var(--accent);
  border-radius: 20px;
  border: none;
  outline: none;
  padding: 3px 7px;
}
/* 수정 모드에서는 편집 가능하게 */
.editing-mode .day-card.has-ot .ot-input,
.cal-grid.editing-mode .day-card.has-ot .ot-input {
  cursor: text;
}
.editing-mode .day-card.has-ot .ot-input:focus {
  color: var(--text) !important;
  background: #fff !important;
  border: 1.5px solid var(--accent) !important;
  border-radius: 5px !important;
  padding: 4px 2px !important;
}
/* 편집(삭제) 모드 - 입력란 테두리 강조 */
/* 수정 모드: 모든 입력칸 테두리 강조 */
.editing-mode .ot-input {
  border: 1.5px solid var(--accent) !important;
  background: #eaf4fe !important;
  border-radius: 5px !important;
  color: var(--text) !important;
  padding: 4px 2px !important;
}

/* 편집 모드 확인 버튼 바 */
.edit-bar { display: none !important; }
.edit-bar-UNUSED {
  display: none;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 14px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.edit-bar.visible { display: flex; }
.edit-bar-text { font-size: 13px; color: var(--sub); }
.edit-bar-text strong { color: var(--accent); }
.edit-btns { display: flex; gap: 8px; }
.btn-cancel {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--sub); border-radius: 9px; padding: 8px 16px;
  font-size: 13px; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all .2s;
}
.btn-cancel:active { background: var(--border); }
.btn-confirm {
  background: var(--accent); border: none;
  color: white; border-radius: 9px; padding: 8px 18px;
  font-size: 13px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all .2s;
  box-shadow: 0 2px 8px rgba(79,128,255,.35);
}
.btn-confirm:active { opacity: .85; }

/* ═══ 연간정산 ═══ */
.section-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px;
}
.section-title {
  font-size: 18px; font-weight: 700; color: var(--text);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
/* 연간 정산 테이블 - 이미지 스타일 */
.annual-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.annual-table thead tr {
  border-bottom: 2px solid var(--border);
  background: var(--bg);
}
.annual-table th {
  padding: 10px 8px; text-align: right;
  color: var(--sub); font-weight: 700; font-size: 12px;
  background: var(--bg);
}
.annual-table th:first-child { text-align: left; }
.annual-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .15s;
}
.annual-table tbody tr:hover { background: var(--bg); }
.annual-table td {
  padding: 11px 8px; text-align: right;
  color: var(--text); font-size: 13px;
}
.annual-table td:first-child { text-align: left; font-weight: 700; color: var(--text); }
.annual-table td:not(:first-child) { color: var(--sub); }
.annual-table tbody tr td:nth-child(2) { font-weight: 500; }
/* 잔업 있는 행 강조 */
.annual-table tbody tr.has-data td { color: var(--text); }
.annual-table tbody tr.has-data td:first-child { color: var(--accent); }
/* 합계 행 */
.annual-table tfoot tr {
  border-top: 2px solid var(--gold);
  background: rgba(245,158,11,.04);
}
.annual-table tfoot td {
  font-weight: 700; font-size: 14px; padding: 12px 8px;
  color: var(--gold);
}
.annual-table tfoot td:first-child { color: var(--text); }
/* annual-boxes 제거 (합계에 통합) */
.annual-boxes { display: none; }
.abox { display: none; }

/* ═══ 연차 ═══ */
.tenure-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.tbox {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 6px; text-align: center;
}
.tbox.green { border-color: rgba(34,197,94,.3); background: rgba(34,197,94,.06); }
.tbox .tl { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
.tbox .tv { font-size: 16px; font-weight: 700; color: var(--text); }
.tbox.green .tv { color: var(--green); }
.tbox .tu { font-size: 10px; color: var(--muted); }

.join-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.join-row label { font-size: 12px; color: var(--sub); white-space: nowrap; }
.join-row input[type=date] {
  flex: 1; background: #fff;
  border: 1.5px solid var(--border); border-radius: 9px;
  padding: 8px 10px; font-size: 14px; color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
}
.join-row input[type=date]:focus { outline: none; border-color: var(--green); }

.leave-summary {
  display: none;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 14px;
  box-shadow: 0 1px 6px rgba(0,0,0,.05);
}
.leave-summary.visible { display: flex; align-items: center; gap: 16px; }

/* 왼쪽: 도넛 + 잔여 강조 */
.leave-summary-top {
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.donut-wrap { position: relative; flex-shrink: 0; }
.donut-wrap svg { display: block; }
.donut-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); text-align: center;
}
.donut-center .dn { font-size: 20px; font-weight: 800; color: var(--green); line-height: 1; }
.donut-center .dl { font-size: 9px; color: var(--muted); margin-top: 3px; }
.leave-remain-info { flex: 1; }
.leave-remain-info .ri-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
.leave-remain-info .ri-value { font-size: 28px; font-weight: 800; color: var(--green); line-height: 1; }
.leave-remain-info .ri-unit { font-size: 13px; color: var(--sub); margin-left: 2px; }

/* 우측: 총발생/사용 2칸 */
.leave-stats-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1;
}
.ls-box {
  background: var(--bg); border-radius: 10px;
  padding: 10px 12px; text-align: center;
}
.ls-box.used-box { background: #fff5f5; }
.ls-box .ls-label { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
.ls-box .ls-val { font-size: 18px; font-weight: 700; color: var(--text); }
.ls-box.used-box .ls-val { color: var(--red); }
.ls-box .ls-unit { font-size: 10px; color: var(--muted); }

.timeline-scroll { /* no scroll - toggle instead */ }
.tl-toggle-btn {
  display: flex; align-items: center; gap: 4px;
  background: none; border: 1.5px solid var(--border);
  border-radius: 20px; padding: 4px 12px;
  font-size: 11px; font-weight: 600; color: var(--sub);
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.tl-toggle-btn:active { background: var(--bg); }
.tl-toggle-btn.expanded { border-color: var(--accent); color: var(--accent); }
.tl-header {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 12px;
}
.timeline { position: relative; padding-left: 18px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--border); border-left: 1px dashed var(--border); }
.tl-item { position: relative; padding: 0 0 12px 12px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -12px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--border); border: 1.5px solid var(--surface); }
.tl-item.past .tl-dot { background: var(--green); }
.tl-item.now .tl-dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(79,128,255,.2); }
.tl-date { font-size: 10px; color: var(--muted); }
.tl-item.past .tl-date { color: var(--green); }
.tl-item.now .tl-date { color: var(--accent); font-weight: 700; }
.tl-desc { font-size: 12px; font-weight: 600; color: var(--sub); margin-top: 2px; }
.tl-item.past .tl-desc { color: var(--text); }

.use-form { margin-bottom: 14px; }
.use-row { display: flex; gap: 8px; margin-bottom: 8px; }
.use-row input, .use-row select {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 9px; padding: 9px 10px; font-size: 13px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
}
.use-row input[type=date], .use-row input[type=text] { flex: 1; }
.use-row input:focus, .use-row select:focus { outline: none; border-color: var(--green); }
.use-row select option { background: var(--surface); }
.btn-add {
  background: var(--green); border: none; color: white;
  border-radius: 9px; padding: 9px 16px; font-size: 13px;
  font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.btn-add:active { opacity: .85; }

.leave-list { /* toggle instead of scroll */ }
.leave-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.leave-item:last-child { border-bottom: none; }
.li-date { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.li-memo { font-size: 13px; font-weight: 600; color: var(--text); }
.li-right { display: flex; align-items: center; gap: 8px; }
.li-badge {
  background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.3);
  color: var(--gold); font-size: 11px; font-weight: 700;
  border-radius: 6px; padding: 2px 8px; white-space: nowrap;
}
.li-del {
  background: none; border: none; color: var(--muted);
  font-size: 15px; cursor: pointer; padding: 2px;
  transition: color .2s;
}
.li-del:active { color: var(--red); }
.no-leave { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

  /* ═══ 데이터 관리 모달 ═══ */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(30,38,64,.5);
    backdrop-filter: blur(4px);
    z-index: 300;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }

<body>

<script>
// ═══ 상태 ═══
let YEAR = new Date().getFullYear();
let curMonth = new Date().getMonth() + 1;
let curView = 'ot';
let isEditing = false;
let editSnapshot = {};
let leaveUses = [];
let salaryByMonth = {}; // { '2026-3': 3302200, '2026-4': 3500000 }

// ═══ 연도 ═══
function updateYearLabel() {
  document.getElementById('yearLabel').innerText = YEAR;
}
function changeYear(d) {
  YEAR += d;
  updateYearLabel();
  buildAll();
  loadHours();
  if (curView === 'ot') showCalMonth(curMonth);
  else if (curView === 'annual') renderAnnual();
}

// ═══ 탭바 & 달력 생성 ═══
function buildAll() {
  const tabs = document.getElementById('monthTabs');
  const cal = document.getElementById('calArea');
  tabs.innerHTML = '';
  cal.innerHTML = '';

  for (let m = 1; m <= 12; m++) {
    tabs.innerHTML += `<button class="month-tab" onclick="showCalMonth(${m})" id="mtab${m}">${m}월</button>`;

    const firstDay = new Date(YEAR, m-1, 1).getDay();
    const lastDate = new Date(YEAR, m, 0).getDate();
    const today = new Date();
    const isCurMonth = today.getFullYear() === YEAR && today.getMonth()+1 === m;

    const wdHdr = ['일','월','화','수','목','금','토'].map((d,i) =>
      `<div class="wd-label ${i===0?'sun':i===6?'sat':''}">${d}</div>`
    ).join('');

    let cells = '';
    for (let e = 0; e < firstDay; e++) cells += `<div class="day-card empty"></div>`;
    for (let d = 1; d <= lastDate; d++) {
      const dow = (firstDay + d - 1) % 7;
      const isSat = dow === 6, isSun = dow === 0;
      const isToday = isCurMonth && today.getDate() === d;
      const cls = [isSat?'sat':isSun?'sun':'', isToday?'today':''].filter(Boolean).join(' ');
      cells += `<div class="day-card ${cls}" id="dc${m}_${d}">
        <div class="day-num">${d}</div>
        <div class="ot-display" id="disp${m}_${d}">-</div>
        <div class="ot-unit" id="unit${m}_${d}"></div>
        <input class="ot-input" type="number" inputmode="decimal" min="0" max="24" step="0.5"
          id="inp${m}_${d}" placeholder="-"
          oninput="onDirectInput(this,${m},${d})"
          onblur="onDirectBlur(this,${m},${d})">
      </div>`;
    }

    cal.innerHTML += `<div id="cal${m}" style="display:none">
      <div class="cal-header">
        <div class="cal-title">${YEAR}년 ${m}월</div>
        <button class="cal-mode-btn" id="editBtn${m}" onclick="toggleEdit(${m})">✎ 수정</button>
      </div>
      <div class="weekday-row">${wdHdr}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  }
}

// ═══ 달력 월 전환 ═══
function showCalMonth(m) {
  if (isEditing) cancelEdit();
  document.querySelectorAll('[id^="cal"]').forEach(el => { if(el.id.match(/^cal\d+$/)) el.style.display = 'none'; });
  document.querySelectorAll('.month-tab').forEach(b => b.classList.remove('active'));
  const calEl = document.getElementById('cal' + m);
  if (calEl) calEl.style.display = 'block';
  const tabEl = document.getElementById('mtab' + m);
  if (tabEl) { tabEl.classList.add('active'); tabEl.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
  curMonth = m;
  document.getElementById('curMonthLabel').innerText = m;
  // 해당 월 기본급 불러오기
  loadSalaryForMonth(m);
  updateDispAll(m);
  calc();
}

// ═══ 직접 입력 ═══
function onDirectInput(el, m, d) {
  const existing = getHourVal(m, d);
  if (existing > 0 && !isEditing) {
    // 기존 값 있으면 수정 불가 → 원래 값으로 되돌림
    el.value = existing;
    return;
  }
  if (isEditing) return; // 수정 모드는 저장 버튼으로
  const v = Number(el.value) || 0;
  setHourVal(m, d, v);
  const dc = document.getElementById(`dc${m}_${d}`);
  if (dc) dc.classList.toggle('has-ot', v > 0);
  saveData();
  calc();
}
function onDirectBlur(el, m, d) {
  const existing = getHourVal(m, d);
  if (existing > 0 && !isEditing) {
    // 기존 값 있는 칸 → 원래 값 복원
    el.value = existing;
    return;
  }
  if (isEditing) return;
  const v = Number(el.value) || 0;
  if (v === 0) el.value = '';
  const dc = document.getElementById(`dc${m}_${d}`);
  if (dc) dc.classList.toggle('has-ot', v > 0);
}

// ═══ 수정 모드 시작 ═══
function startEdit(m) {
  if (isEditing) { confirmEdit(); return; }
  isEditing = true;
  // 스냅샷 저장 (취소 시 복원용)
  editSnapshot = {};
  for (let d = 1; d <= 31; d++) {
    editSnapshot[d] = getHourVal(m, d);
  }
  // UI 전환
  const grid = document.getElementById('cal' + m)?.querySelector('.cal-grid');
  if (grid) grid.classList.add('editing-mode');
  const btn = document.getElementById('editBtn' + m);
  if (btn) { btn.classList.add('editing'); btn.innerText = '✓ 완료'; }
  document.getElementById('editBar').classList.add('visible');
}

function toggleEdit(m) {
  if (isEditing) { confirmEdit(); return; }
  isEditing = true;
  // 스냅샷 저장
  editSnapshot = {};
  for (let d = 1; d <= 31; d++) {
    const inp = document.getElementById(`inp${m}_${d}`);
    if (inp) editSnapshot[d] = inp.value;
  }
  // UI 전환
  document.getElementById('cal' + m).querySelector('.cal-grid').classList.add('editing-mode');
  document.getElementById('editBtn' + m).classList.add('editing');
  document.getElementById('editBtn' + m).innerText = '✓ 완료';
  document.getElementById('editBar').classList.add('visible');
  // input에 현재 값 채우기
  for (let d = 1; d <= 31; d++) {
    const disp = document.getElementById(`disp${m}_${d}`);
    const inp = document.getElementById(`inp${m}_${d}`);
    if (!inp) continue;
    const stored = getHourVal(m, d);
    inp.value = stored > 0 ? stored : '';
  }
}

function confirmEdit() {
  const m = curMonth;
  // input 값 → hourData 반영
  for (let d = 1; d <= 31; d++) {
    const inp = document.getElementById(`inp${m}_${d}`);
    if (inp) {
      const v = Number(inp.value) || 0;
      setHourVal(m, d, v);
    }
  }
  finishEdit(m);
  saveData();
  updateDispAll(m);
  calc();
}

function cancelEdit() {
  const m = curMonth;
  // 스냅샷으로 복원
  for (let d = 1; d <= 31; d++) {
    const v = editSnapshot[d] || 0;
    setHourVal(m, d, v);
  }
  finishEdit(m);
  updateDispAll(m);
  calc();
}

function finishEdit(m) {
  isEditing = false;
  const grid = document.getElementById('cal' + m)?.querySelector('.cal-grid');
  if (grid) grid.classList.remove('editing-mode');
  const btn = document.getElementById('editBtn' + m);
  if (btn) { btn.classList.remove('editing'); btn.innerText = '✎ 수정'; }
  document.getElementById('editBar').classList.remove('visible');
}

// ═══ 시간 저장소 (년-월-일 키) ═══
const hourData = {}; // { '2026-3-22': 2.5 }
function hourKey(m, d) { return `${YEAR}-${m}-${d}`; }
function getHourVal(m, d) { return hourData[hourKey(m,d)] || 0; }
function setHourVal(m, d, v) {
  const k = hourKey(m,d);
  if (v > 0) hourData[k] = v; else delete hourData[k];
  // day-card has-ot 클래스
  const dc = document.getElementById(`dc${m}_${d}`);
  if (dc) dc.classList.toggle('has-ot', v > 0);
}

function updateDispAll(m) {
  for (let d = 1; d <= 31; d++) {
    const inp = document.getElementById(`inp${m}_${d}`);
    const dc = document.getElementById(`dc${m}_${d}`);
    if (!inp) continue;
    const v = getHourVal(m, d);
    inp.value = v > 0 ? v : '';
    if (dc) dc.classList.toggle('has-ot', v > 0);
  }
}

// ═══ 계산 ═══
function getMonthHours(m) {
  let h = 0;
  for (let d = 1; d <= 31; d++) h += getHourVal(m, d);
  return h;
}

// 해당 월 기본급 가져오기 (없으면 이전 달에서 상속)
function getEffectiveSalary(m) {
  let val = salaryByMonth[`${YEAR}-${m}`];
  if (val) return Number(val);
  for (let i = m-1; i >= 1; i--) {
    if (salaryByMonth[`${YEAR}-${i}`]) return Number(salaryByMonth[`${YEAR}-${i}`]);
  }
  for (let i = 12; i >= 1; i--) {
    if (salaryByMonth[`${YEAR-1}-${i}`]) return Number(salaryByMonth[`${YEAR-1}-${i}`]);
  }
  return 0;
}

function calc() {
  const salary = getEffectiveSalary(curMonth);
  const hourly = salary / 209;
  const h = getMonthHours(curMonth);
  const ot = Math.floor(h * hourly * 1.5);
  document.getElementById('totalH').innerText = h;
  document.getElementById('otPay').innerText = ot.toLocaleString();
  document.getElementById('finalAmt').innerText = salary > 0 ? (salary + ot).toLocaleString() : '-';
}

function renderAnnual() {
  const tbody = document.getElementById('annualBody');
  tbody.innerHTML = '';
  let tH = 0, tOt = 0, tFin = 0;
  for (let m = 1; m <= 12; m++) {
    const mSalary = getEffectiveSalary(m);
    const hourly = mSalary / 209;
    const h = getMonthHours(m);
    const ot = Math.floor(h * hourly * 1.5);
    const fin = mSalary + ot;
    tH += h; tOt += ot; tFin += fin;
    tbody.innerHTML += `<tr class="${h>0?'has-data':''}"><td>${m}월</td><td>${h||0}</td><td>${ot.toLocaleString()}</td><td>${mSalary>0?fin.toLocaleString():'-'}</td></tr>`;
  }
  document.getElementById('aTotalH').innerText = tH;
  document.getElementById('aTotalOt').innerText = tOt.toLocaleString();
  document.getElementById('aTotalFin').innerText = tFin.toLocaleString();
  document.getElementById('aBoxH').innerText = tH + 'h';
  document.getElementById('aBoxOt').innerText = tOt.toLocaleString() + '원';
  document.getElementById('aBoxFin').innerText = tFin.toLocaleString() + '원';
}

// ═══ 기본급 콤마 포맷 ═══
function loadSalaryForMonth(m) {
  const tag = document.getElementById('salaryMonthTag');
  const inp = document.getElementById('salaryDisplay');
  const btn = document.getElementById('salaryEditBtn');

  // 수정 모드 리셋
  salaryEditing = false;
  inp.setAttribute('readonly', true);
  inp.classList.add('locked');
  if (btn) { btn.classList.remove('editing'); btn.innerText = '✎ 수정'; }

  // 해당 월 값 찾기 → 없으면 가장 최근 달 값 자동 채움
  let val = salaryByMonth[`${YEAR}-${m}`];
  let inherited = false;
  if (!val) {
    for (let i = m-1; i >= 1; i--) {
      if (salaryByMonth[`${YEAR}-${i}`]) { val = salaryByMonth[`${YEAR}-${i}`]; inherited = true; break; }
    }
    if (!val) {
      for (let i = 12; i >= 1; i--) {
        if (salaryByMonth[`${YEAR-1}-${i}`]) { val = salaryByMonth[`${YEAR-1}-${i}`]; inherited = true; break; }
      }
    }
  }

  if (val) {
    document.getElementById('baseSalary').value = val;
    inp.value = Number(val).toLocaleString();
    if (tag) {
      tag.innerText = m + '월';
      // 이 달 직접 저장된 값이면 파란색, 이전 달에서 따라온 값이면 회색
      tag.style.background = inherited ? 'rgba(156,163,175,.15)' : 'rgba(59,107,250,.1)';
      tag.style.color = inherited ? 'var(--muted)' : 'var(--accent)';
    }
  } else {
    document.getElementById('baseSalary').value = '';
    inp.value = '';
    if (tag) { tag.innerText = m+'월'; tag.style.background='rgba(156,163,175,.15)'; tag.style.color='var(--muted)'; }
  }
}

// ═══ 연차 ═══
function onJoinChange() { saveData(); renderLeave(); }

function calcLeaveEvents(joinDate) {
  const events = [];
  const join = new Date(joinDate); join.setHours(0,0,0,0);
  for (let m = 1; m <= 11; m++) {
    const d = new Date(join); d.setMonth(d.getMonth() + m);
    events.push({ date: new Date(d), label: `${m}개월 만근`, days: 1 });
  }
  for (let y = 1; y <= 30; y++) {
    const d = new Date(join); d.setFullYear(d.getFullYear() + y);
    const days = Math.min(15 + Math.floor((y-1)/2), 25);
    events.push({ date: new Date(d), label: `${y}년차 연차`, days });
  }
  return events.sort((a,b) => a.date - b.date);
}

function renderLeave() {
  const jv = document.getElementById('joinDate').value;
  if (!jv) return;
  const join = new Date(jv); join.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  if (join > today) return;

  let yrs = today.getFullYear() - join.getFullYear();
  let mos = today.getMonth() - join.getMonth();
  if (today.getDate() < join.getDate()) mos--;
  if (mos < 0) { yrs--; mos += 12; }
  document.getElementById('tenureY').innerText = yrs;
  document.getElementById('tenureM').innerText = yrs*12 + mos;

  const events = calcLeaveEvents(jv);
  const total = events.filter(e => e.date <= today).reduce((s,e) => s+e.days, 0);
  document.getElementById('totalLeave').innerText = total;

  const used = leaveUses.reduce((s,u) => s + Number(u.days), 0);
  const remain = Math.max(total - used, 0);

  document.getElementById('leaveSummary').classList.toggle('visible', total > 0);
  document.getElementById('lsTotal').innerText = total;
  document.getElementById('lsUsed').innerText = used;
  const lsRemainEl = document.getElementById('lsRemain');
  if (lsRemainEl) lsRemainEl.innerText = remain;
  document.getElementById('donutNum').innerText = remain;
  const riEl = document.getElementById('riRemain');
  if (riEl) riEl.innerText = remain;
  const circ = 175.9;
  const pct = total > 0 ? remain / total : 0;
  document.getElementById('donutArc').setAttribute('stroke-dashoffset', circ - circ*pct);

  document.getElementById('timelineCard').style.display = 'block';

  // 발생한 연차만 표시 (오늘 이전), 최신순 전체 (스크롤로 확인)
  const pastAll = events.filter(e => e.date <= today).sort((a,b) => b.date - a.date);

  function makeTlItem(e) {
    const ds = `${e.date.getFullYear()}.${String(e.date.getMonth()+1).padStart(2,'0')}.${String(e.date.getDate()).padStart(2,'0')}`;
    return `<div class="tl-item past"><div class="tl-dot"></div><div class="tl-date">${ds} ✅</div><div class="tl-desc">${e.label} +${e.days}일</div></div>`;
  }

  const noEvt = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:12px 0">아직 발생한 연차가 없어요</div>';

  // 접힌 상태: 최신 1개만 timeline 없이 심플하게
  const collapsed = document.getElementById('tlCollapsed');
  if (pastAll.length === 0) {
    collapsed.innerHTML = noEvt;
  } else {
    const e = pastAll[0];
    const ds = `${e.date.getFullYear()}.${String(e.date.getMonth()+1).padStart(2,'0')}.${String(e.date.getDate()).padStart(2,'0')}`;
    collapsed.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;display:inline-block"></span>
      <span style="font-size:12px;color:var(--muted)">${ds} ✅</span>
      <span style="font-size:12px;font-weight:600;color:var(--text)">${e.label} +${e.days}일</span>
      ${pastAll.length > 1 ? `<span style="font-size:11px;color:var(--muted)">외 ${pastAll.length-1}개</span>` : ''}
    </div>`;
  }

  // 펼친 상태: 전체 타임라인
  document.getElementById('leaveTimeline').innerHTML = pastAll.length === 0
    ? noEvt
    : `<div class="timeline">${pastAll.map(makeTlItem).join('')}</div>`;

  renderLeaveList();
}

function toggleTimeline() {
  const collapsed = document.getElementById('tlCollapsed');
  const expanded = document.getElementById('tlExpanded');
  const btn = document.getElementById('tlToggleBtn');
  const icon = document.getElementById('tlToggleIcon');
  const text = document.getElementById('tlToggleText');
  const isOpen = expanded.style.display !== 'none';
  if (isOpen) {
    collapsed.style.display = 'block';
    expanded.style.display = 'none';
    btn.classList.remove('expanded');
    icon.innerText = '▼';
    text.innerText = '전체보기';
  } else {
    collapsed.style.display = 'none';
    expanded.style.display = 'block';
    btn.classList.add('expanded');
    icon.innerText = '▲';
    text.innerText = '접기';
  }
}

function renderLeaveList() {
  const collapsed = document.getElementById('lvCollapsed');
  const list = document.getElementById('leaveList');
  const noMsg = '<div class="no-leave">아직 사용한 연차가 없어요 🌱</div>';

  if (!leaveUses.length) {
    collapsed.innerHTML = noMsg;

    </div>
  </div>`;

  if (list) list.innerHTML = sorted.map((u, i) => makeLvItem(u, i)).join('');

function addLeave() {
  const date = document.getElementById('useDate').value;
  const typeVal = document.getElementById('useDays').value;
  const memo = document.getElementById('useMemo').value.trim();
  if (!date) { alert('날짜를 선택해 주세요'); return; }
  const dayNum = (typeVal === '0.5am' || typeVal === '0.5pm') ? 0.5 : Number(typeVal);
  leaveUses.push({ date, days: dayNum, type: typeVal, memo });
  leaveUses.sort((a,b) => new Date(a.date)-new Date(b.date));
  document.getElementById('useDate').value = '';
  document.getElementById('useMemo').value = '';
  saveData(); renderLeave();
}

function delLeave(idx) {
  const sorted = [...leaveUses].sort((a,b) => new Date(b.date)-new Date(a.date));
  const t = sorted[idx];
  const typeLabel = t.type==='0.5am' ? '오전반차' : t.type==='0.5pm' ? '오후반차' : t.days===0.5 ? '반차' : t.days+'일';
  const confirm = window.confirm(`삭제하시겠어요?\n\n📅 ${t.date}  ${typeLabel}${t.memo ? '\n📝 ' + t.memo : ''}`);
  if (!confirm) return;
  const i = leaveUses.findIndex(u => u.date===t.date && u.days===t.days && u.memo===t.memo);
  if (i !== -1) leaveUses.splice(i, 1);
  saveData(); renderLeave();
}

// ═══ 저장/불러오기 ═══
function saveData() {
  const allHours = {};
  Object.entries(hourData).forEach(([k,v]) => { allHours[k] = v; });
  localStorage.setItem('ot3-hours', JSON.stringify(allHours));

  const common = {
    salaryByMonth,
    joinDate: document.getElementById('joinDate').value,
    leaveUses
  };
  localStorage.setItem('ot3-common', JSON.stringify(common));
}

function loadData() {
  try {
    const hRaw = localStorage.getItem('ot3-hours');
    if (hRaw) Object.assign(hourData, JSON.parse(hRaw));
  } catch(e) {}
  try {
    const cRaw = localStorage.getItem('ot3-common');
    if (cRaw) {
      const d = JSON.parse(cRaw);
      // 월별 기본급 복원
      if (d.salaryByMonth) Object.assign(salaryByMonth, d.salaryByMonth);
      // 구버전 호환: salary 단일값
      if (d.salary && !d.salaryByMonth) salaryByMonth[`${YEAR}-${curMonth}`] = Number(d.salary);
      if (d.joinDate) document.getElementById('joinDate').value = d.joinDate;
      if (d.leaveUses) leaveUses = d.leaveUses;
    }
  } catch(e) {}
}

function loadHours() {
  for (let m = 1; m <= 12; m++) updateDispAll(m);
}

// ═══ 데이터 관리 ═══
function openDataModal() {
  document.getElementById('dataModal').classList.add('open');
}
function closeDataModal() {
  document.getElementById('dataModal').classList.remove('open');
}
function closeDataModalOutside(e) {
  if (e.target === document.getElementById('dataModal')) closeDataModal();
}

function exportData() {
  // 전체 hourData + common 수집
  const common = {
    salary: document.getElementById('baseSalary').value,
    joinDate: document.getElementById('joinDate').value,
    leaveUses
  };
  const exportObj = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    common,
    hours: hourData
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date();
  const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `잔업정산_데이터_${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
  closeDataModal();
  alert('데이터가 저장되었어요! 📁\n파일명: 잔업정산_데이터_' + dateStr + '.json');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.common || !data.hours) throw new Error('형식 오류');
      if (!confirm(`데이터를 불러올까요?\n⚠️ 현재 데이터가 덮어쓰여집니다.\n\n내보낸 날짜: ${data.exportedAt ? data.exportedAt.slice(0,10) : '알 수 없음'}`)) return;
      // common 복원
      if (data.common.salary) {
        document.getElementById('baseSalary').value = data.common.salary;
        document.getElementById('salaryDisplay').value = Number(data.common.salary).toLocaleString();
      }
      if (data.common.joinDate) document.getElementById('joinDate').value = data.common.joinDate;
      if (data.common.leaveUses) leaveUses = data.common.leaveUses;
      // hours 복원
      Object.keys(hourData).forEach(k => delete hourData[k]);
      Object.assign(hourData, data.hours);
      // localStorage 저장
      localStorage.setItem('ot3-hours', JSON.stringify(hourData));
      localStorage.setItem('ot3-common', JSON.stringify({
        salary: data.common.salary,
        joinDate: data.common.joinDate,
        leaveUses: data.common.leaveUses || []
      }));
      // UI 갱신
      buildAll();
      loadHours();
      showCalMonth(curMonth);
      if (document.getElementById('joinDate').value) renderLeave();
      closeDataModal();
      alert('데이터를 성공적으로 불러왔어요! ✅');
    } catch(err) {
      alert('파일을 읽을 수 없어요.\n잔업정산기에서 내보낸 JSON 파일인지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetData() {
  if (!confirm('⚠️ 정말 초기화할까요?\n\n모든 잔업 기록, 연차 데이터가 삭제됩니다.\n이 작업은 되돌릴 수 없어요.')) return;

  // localStorage 전부 삭제
  localStorage.removeItem('ot3-hours');
  localStorage.removeItem('ot3-common');

  // 메모리 초기화
  Object.keys(hourData).forEach(k => delete hourData[k]);
  leaveUses = [];

  // UI 초기화 - 잔업
  Object.keys(salaryByMonth).forEach(k => delete salaryByMonth[k]);
  document.getElementById('baseSalary').value = '';
  document.getElementById('salaryDisplay').value = '';
  document.getElementById('finalAmt').innerText = '0';
  document.getElementById('totalH').innerText = '0';
  document.getElementById('otPay').innerText = '0';

  // UI 초기화 - 연차
  document.getElementById('joinDate').value = '';
  document.getElementById('tenureY').innerText = '-';
  document.getElementById('tenureM').innerText = '-';
  document.getElementById('totalLeave').innerText = '-';
  document.getElementById('leaveSummary').classList.remove('visible');
  document.getElementById('timelineCard').style.display = 'none';
  document.getElementById('leaveTimeline').innerHTML = '';
  const tlCol = document.getElementById('tlCollapsed');
  const tlExp = document.getElementById('tlExpanded');
  if (tlCol) { tlCol.innerHTML = ''; tlCol.style.display = 'block'; }
  if (tlExp) tlExp.style.display = 'none';
  const tlBtn = document.getElementById('tlToggleBtn');
  if (tlBtn) { tlBtn.classList.remove('expanded'); }
  const tlIcon = document.getElementById('tlToggleIcon');
  const tlText = document.getElementById('tlToggleText');
  if (tlIcon) tlIcon.innerText = '▼';
  if (tlText) tlText.innerText = '전체보기';
  document.getElementById('leaveList').innerHTML = '<div class="no-leave">아직 사용한 연차가 없어요 🌱</div>';
  const lvCol = document.getElementById('lvCollapsed');
  const lvExp = document.getElementById('lvExpanded');
  if (lvCol) { lvCol.innerHTML = ''; lvCol.style.display = 'block'; }
  if (lvExp) lvExp.style.display = 'none';
  const lvBtn = document.getElementById('lvToggleBtn');
  if (lvBtn) { lvBtn.classList.remove('expanded'); lvBtn.style.display = 'none'; }
  const lsTotal = document.getElementById('lsTotal');
  const lsUsed = document.getElementById('lsUsed');
  const donutNum = document.getElementById('donutNum');
  const riRemain = document.getElementById('riRemain');
  if (lsTotal) lsTotal.innerText = '0';
  if (lsUsed) lsUsed.innerText = '0';
  if (donutNum) donutNum.innerText = '0';
  if (riRemain) riRemain.innerText = '0';
  document.getElementById('donutArc').setAttribute('stroke-dashoffset', '175.9');

  // 달력 재빌드
  buildAll();
  showCalMonth(curMonth);
  closeDataModal();
  alert('초기화 완료! 🗑️');
}
